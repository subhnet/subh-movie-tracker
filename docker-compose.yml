version: '3.8'

services:
  app:
    build: .
    container_name: movie-tracker
    ports:
      - "3000:3000"
    volumes:
      - ./.env:/app/.env
      - ./public/watched_titles.csv:/app/public/watched_titles.csv
      - ./public/wants_titles.csv:/app/public/wants_titles.csv
      - ./public/shows_titles.csv:/app/public/shows_titles.csv
      - ./docs/STATS.md:/app/docs/STATS.md
      - ./index.html:/app/index.html
      - ./backups:/app/backups
    environment:
      - NODE_ENV=production
    restart: unless-stopped
