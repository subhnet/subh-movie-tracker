version: '3.8'

services:
  app:
    build: .
    container_name: movie-tracker
    ports:
      - "3000:3000"
    volumes:
      - ./.env:/app/.env
      - ./data/watched_titles.csv:/app/data/watched_titles.csv
      - ./data/wants_titles.csv:/app/data/wants_titles.csv
      - ./data/shows_titles.csv:/app/data/shows_titles.csv
      - ./docs/STATS.md:/app/docs/STATS.md
      - ./index.html:/app/index.html
      - ./backups:/app/backups
    environment:
      - NODE_ENV=production
    restart: unless-stopped
